<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roles — Scheduler</title>
<style>
  :root {
    --ink:#1d2126; --muted:#6b7480; --line:#dfe3e8; --bg:#f6f7f9;
    --warn-bg:#fff6e6; --warn-line:#d1892f; --warn-ink:#7a4c00;
    --stop-bg:#fdecea; --stop-line:#c0392b; --stop-ink:#8a1f00;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 20px;
           display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:1080px; margin:20px auto; padding:0 20px 60px; }

  .card { background:#fff; border:1px solid var(--line); border-radius:8px;
          padding:16px 18px; margin-bottom:14px; }
  .card.dirty { border-color:#3d6f8e; box-shadow:0 0 0 3px rgba(61,111,142,.12); }

  .rowhead { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .swatch { width:16px; height:16px; border-radius:4px; border:1px solid rgba(0,0,0,.2); flex:none; }
  .rname { font-weight:650; font-size:16px; border:none; background:transparent;
           font-family:inherit; color:inherit; padding:2px 4px; border-radius:4px; min-width:12ch; }
  .rname:focus { background:var(--bg); outline:2px solid #3d6f8e; }
  .grow { flex:1 1 auto; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input, select { width:100%; font:inherit; padding:6px 8px;
                  border:1px solid var(--line); border-radius:5px; background:#fff; }
  input[type=color] { padding:2px; height:34px; }

  .note { margin-top:11px; padding:8px 11px; border-radius:5px; font-size:13px; }
  .note.warn { background:var(--warn-bg); border-left:3px solid var(--warn-line); color:var(--warn-ink); }
  .note.stop { background:var(--stop-bg); border-left:3px solid var(--stop-line); color:var(--stop-ink); }

  button { font:inherit; font-weight:600; cursor:pointer; border-radius:6px;
           border:1px solid var(--line); background:#fff; padding:7px 14px; }
  button.primary { background:#2f6f4f; border-color:#2f6f4f; color:#fff; }
  button:disabled { opacity:.45; cursor:default; }

  #bar { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line);
         padding:11px 20px; display:none; gap:10px; align-items:center; }
  #bar.on { display:flex; }
  .status { color:var(--muted); font-size:13px; }

  #login { max-width:340px; margin:70px auto; background:#fff; padding:22px;
           border:1px solid var(--line); border-radius:8px; }
  #login input { margin-bottom:10px; }
  .err { color:var(--stop-ink); font-size:13px; margin-top:8px; }
  .inactive { opacity:.55; }
</style>
</head>
<body>

<div id="login">
  <h1 style="margin:0 0 4px">Scheduler</h1>
  <p class="sub" style="margin:0 0 16px">Sign in to manage roles.</p>
  <input id="email" type="email" placeholder="email" value="staff@bingohalls.app" autocomplete="username">
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button class="primary" style="width:100%" id="signin">Sign in</button>
  <div class="err" id="loginerr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1>Roles</h1>
    <span class="sub" id="hdr">The jobs a session is staffed with.</span>
    <span class="grow"></span>
    <button id="signout">Sign out</button>
  </header>
  <main id="list"></main>
  <div id="bar">
    <button class="primary" id="save">Save changes</button>
    <button id="revert">Discard</button>
    <span class="status" id="status"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10"></script>
<script>
const SUPABASE_URL = 'https://lkcfbgnuodqzvowschjn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_t3vO3q1Y7PRH3qVp_64dfg_L4Zr1fIT';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let roles = [];      // server state
let edits = {};      // id -> {field: value}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* value as currently edited, falling back to server state */
const val = (r, f) => (edits[r.id] && f in edits[r.id]) ? edits[r.id][f] : r[f];
const dirty = (r) => !!edits[r.id] && Object.keys(edits[r.id]).length > 0;
const anyDirty = () => roles.some(dirty);

function setEdit(id, field, value) {
  const r = roles.find(x => x.id === id);
  edits[id] = edits[id] || {};
  if (String(r[field] ?? '') === String(value ?? '')) delete edits[id][field];
  else edits[id][field] = value;
  if (!Object.keys(edits[id]).length) delete edits[id];
  render();
}

/**
 * The interesting bit. A role whose headcount is fixed at N and whose floor
 * coverage is also N can never send anyone on break — there is nobody to
 * cover. That is true of Bingo Manager, Paymaster and Flash Manager as seeded,
 * and it matches the prototype's rule that managers don't take scheduled
 * breaks. Better to say so on screen than to let someone discover it when the
 * break planner mysteriously refuses to schedule anything.
 */
function coverageNote(r) {
  const fixed = val(r, 'fixed_count');
  const floor = Number(val(r, 'min_on_floor') ?? 0);
  if (fixed === null || fixed === '' || fixed === undefined) {
    return floor > 0
      ? { kind:'warn', text:`Headcount is set per session. At least ${floor} must stay on the floor, so the manager needs to roster more than ${floor} for anyone to get a break.` }
      : null;
  }
  const n = Number(fixed);
  if (floor > n) return { kind:'stop', text:`Impossible: ${floor} must stay on the floor but only ${n} are ever rostered. The break planner will never satisfy this.` };
  if (n > 0 && floor === n) return { kind:'warn', text:`Always ${n} on shift and ${floor} required on the floor — this role can never be relieved for a break.` };
  return null;
}

function render() {
  $('list').innerHTML = roles.map(r => {
    const note = coverageNote(r);
    const fixed = val(r, 'fixed_count');
    const isVar = fixed === null || fixed === '' || fixed === undefined;
    const active = val(r, 'active');
    return `
    <div class="card ${dirty(r) ? 'dirty' : ''} ${active ? '' : 'inactive'}">
      <div class="rowhead">
        <span class="swatch" style="background:${esc(val(r,'color') || '#ccc')}"></span>
        <input class="rname" value="${esc(val(r,'name'))}" data-id="${r.id}" data-f="name">
        <span class="grow"></span>
        <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--muted)">
          <input type="checkbox" style="width:auto" data-id="${r.id}" data-f="active" ${active ? 'checked' : ''}> in use
        </label>
      </div>
      <div class="grid">
        <div>
          <label>How many</label>
          <select data-id="${r.id}" data-f="fixed_count">
            <option value="" ${isVar ? 'selected' : ''}>Manager decides each session</option>
            ${[0,1,2,3,4,5].map(n => `<option value="${n}" ${!isVar && Number(fixed)===n ? 'selected' : ''}>Always ${n}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Must stay on floor</label>
          <input type="number" min="0" max="20" value="${esc(val(r,'min_on_floor'))}" data-id="${r.id}" data-f="min_on_floor">
        </div>
        <div>
          <label>Usual start</label>
          <input type="time" value="${esc((val(r,'default_start')||'').slice(0,5))}" data-id="${r.id}" data-f="default_start">
        </div>
        <div>
          <label>Usual end</label>
          <input type="time" value="${esc((val(r,'default_end')||'').slice(0,5))}" data-id="${r.id}" data-f="default_end">
        </div>
        <div>
          <label>Colour</label>
          <input type="color" value="${esc(val(r,'color') || '#888888')}" data-id="${r.id}" data-f="color">
        </div>
      </div>
      ${note ? `<div class="note ${note.kind}">${esc(note.text)}</div>` : ''}
    </div>`;
  }).join('');

  $('bar').classList.toggle('on', anyDirty());
  $('status').textContent = anyDirty()
    ? `${roles.filter(dirty).length} role(s) changed` : '';
}

/* one delegated listener rather than per-field handlers */
$('list').addEventListener('input', e => {
  const el = e.target, id = el.dataset.id, f = el.dataset.f;
  if (!id || !f) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (f === 'fixed_count') v = v === '' ? null : Number(v);
  if (f === 'min_on_floor') v = v === '' ? 0 : Number(v);
  if ((f === 'default_start' || f === 'default_end') && v === '') v = null;
  setEdit(id, f, v);
});
$('list').addEventListener('change', e => {
  if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') {
    $('list').dispatchEvent(new Event('input'));
  }
});

async function load() {
  const { data, error } = await sb.from('sched_roles').select('*').order('sort');
  if (error) { $('status').textContent = 'Load failed: ' + error.message; return; }
  roles = data; edits = {}; render();
  $('hdr').textContent = `${roles.length} roles. The jobs a session is staffed with.`;
}

$('save').addEventListener('click', async () => {
  $('save').disabled = true; $('status').textContent = 'Saving…';
  const failures = [];
  for (const [id, patch] of Object.entries(edits)) {
    const { error } = await sb.from('sched_roles')
      .update({ ...patch, updated_at: new Date().toISOString() }).eq('id', id);
    if (error) failures.push(`${roles.find(r=>r.id===id)?.name}: ${error.message}`);
  }
  $('save').disabled = false;
  if (failures.length) { $('status').textContent = 'Some saves failed — ' + failures.join('; '); return; }
  await load();
  $('status').textContent = 'Saved.';
  setTimeout(() => { if ($('status').textContent === 'Saved.') $('status').textContent = ''; }, 2500);
});

$('revert').addEventListener('click', () => { edits = {}; render(); });

$('signin').addEventListener('click', async () => {
  $('loginerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('pw').value });
  if (error) { $('loginerr').textContent = error.message; return; }
  boot();
});
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });
$('signout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $('login').hidden = false; $('app').hidden = true; return; }
  $('login').hidden = true; $('app').hidden = false;
  await load();
}
boot();
</script>
</body>
</html>
